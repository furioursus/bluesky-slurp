<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slurp</title>
  <meta name="description" content="Archive and read an atproto account's public activity.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600&display=swap">
  <link rel="stylesheet" href="/style.css">
  <script>
    // set theme before first paint so night mode doesn't flash white
    try { const t = localStorage.getItem('slurp-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <header class="grid masthead">
    <a class="cell wordmark" href="#/" aria-label="Slurp home">SLURP</a>
    <nav class="cell nav" aria-label="Main">
      <a href="#/" data-nav="home">New archive</a>
      <a href="#/accounts" data-nav="accounts">Accounts</a>
      <a href="#/about" data-nav="about">About</a>
    </nav>
    <div class="cell tagline">
      <p>Everything an account has put on the atmosphere, on your disk.</p>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <button class="theme-toggle" type="button" aria-label="Toggle day and night mode">
    <span class="theme-label">day</span>
    <span class="theme-dot" aria-hidden="true"></span>
  </button>

  <script type="module" src="/app.js"></script>
</body>
</html>
